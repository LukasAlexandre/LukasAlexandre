# Prepared locally only. Do not dispatch or publish during visual homologation.
name: Update engineering intelligence

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the execution reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-25
        with:
          persist-credentials: false
      - name: Python with dependency cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-11-25
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned render dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect, render and validate
        run: |
          python scripts/build.py --refresh
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit relevant changes only
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git add -- data/contributions.json generated/ README.md
          if git diff --cached --quiet; then
            echo 'No contribution/art changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh engineering intelligence [skip ci]'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$TARGET_REF"
      - name: Summarize failures
        if: failure()
        run: echo 'Collection/render/validation failed. Valid cache is preserved; unchecked art is not committed.' >> "$GITHUB_STEP_SUMMARY"
